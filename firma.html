    const safeUrl=value=>{
      let v=String(value||"").trim();
      if(!v) return "";
      if(/^https?:\/\//i.test(v)) return v;
      return "https://"+v;
    };

    const telUrl=value=>{
      const digits=String(value||"").replace(/[^\d+]/g,"");
      return digits ? "tel:"+digits : "";
    };

    const waUrl=value=>{
      let digits=String(value||"").replace(/\D/g,"");
      digits=digits.replace(/^90/,"").replace(/^0/,"");
      return digits ? "https://wa.me/90"+digits : "";
    };

    const formatPhoneDisplay=value=>{
      const raw=String(value||"").trim();
      let digits=raw.replace(/\D/g,"");
      if(digits.startsWith("90") && digits.length===12) digits="0"+digits.slice(2);
      if(digits.length===10 && !digits.startsWith("0")) digits="0"+digits;
      if(/^0\d{10}$/.test(digits)){
        return "("+digits.slice(0,4)+") "+digits.slice(4,7)+" "+digits.slice(7,9)+" "+digits.slice(9,11);
      }
      return raw.replace(/^(0\d{3})\)/,"($1)");
    };

    function locationFromAddress(address){
      const s=String(address||"").trim();
      if(!s)return null;
      const m=s.match(/([^,;\/]+)\s*\/\s*([^,;]+?)(?:\s*,?\s*(?:Türkiye|Turkey))?$/i);
      if(!m)return null;
      const district=String(m[1]||"").trim();
      const city=String(m[2]||"").trim().replace(/\s+Türkiye$/i,"").trim();
      return district&&city?{district,city}:null;
    }

    function campaignActive(d){
      const active=Boolean(d.campaignActive||d.hasCampaign);
      const title=String(d.campaignTitle||d.promotionTitle||"").trim();
      if(!active||!title)return false;
      const end=d.campaignEnd||d.campaignEndDate||"";
      if(end){
        const date=new Date(end);
        if(!Number.isNaN(date.getTime()) && date.getTime()<Date.now())return false;
      }
      return true;
    }

    function youtubeEmbed(url){
      const value=String(url||"");
      let match=value.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{6,})/);
      if(match) return "https://www.youtube.com/embed/"+match[1];
      return "";
    }

    function buildGallery(d){
      const photos=[
        ...asArray(d.galleryUrls),
        ...asArray(d.photos),
        ...asArray(d.photoUrls)

      const videos=[
        ...asArray(d.videoUrls),
        ...asArray(d.videos),
        d.videoUrl,
        d.youtubeUrl,
        d.promoVideoUrl
      ].filter(Boolean);

      const items=[];

      photos.slice(0,12).forEach((url,index)=>{
        items.push(
          '<button class="media-card photo-card" type="button" data-image="'+esc(url)+'" aria-label="Fotoğrafı büyüt">'+
            '<img src="'+esc(url)+'" alt="'+esc((d.name||"Firma")+" fotoğraf "+(index+1))+'" loading="lazy" onerror="this.closest(\'[data-image]\')?.remove()">'+
          '</button>'
        );
      });

      videos.slice(0,4).forEach(url=>{
        const embed=youtubeEmbed(url);
        if(embed){
          items.push(
            '<div class="media-card video-card">'+
              '<iframe src="'+esc(embed)+'" title="Firma videosu" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>'+
            '</div>'
          );
        }else{
          items.push(
            '<div class="media-card video-card">'+
              '<video controls preload="metadata"><source src="'+esc(url)+'"></video>'+
            '</div>'
          );
        }
      });

      if(!items.length){
        return '<div class="empty-media"><div class="empty-media-icon">📷</div><strong>Fotoğraf ve video henüz eklenmemiş.</strong><span>Firma görselleri eklendiğinde burada görüntülenecek.</span></div>';
      }

      return '<div class="media-grid">'+items.join("")+'</div>';
    }

      const fields=[address,location,name].map(v=>String(v||"").toLocaleLowerCase("tr-TR"));

    function formatFirmTitle(value){
      const text=String(value||"").replace(/\s+/g," ").trim();
      if(!text)return "";
      const keepUpper=new Set(["SRC","MEB","LGS","TYT","AYT","YKS","KPSS","DGS","AÖF","MYO","VIP","A1","A2","B","B1","C","C1","D","D1","BE","CE","DE"]);
      return text.split(" ").map(word=>{
        const bare=word.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"");
        if(!bare)return word;
        const upper=bare.toLocaleUpperCase("tr-TR");
        if(keepUpper.has(upper))return word.replace(bare,upper);
        const low=bare.toLocaleLowerCase("tr-TR");
        const fixed=low.charAt(0).toLocaleUpperCase("tr-TR")+low.slice(1);
        return word.replace(bare,fixed);
      }).join(" ");
    }

      let location=String(d.location||"").trim();

      const isDetailedAddress=v=>/mah\.?|mahalle|cad\.?|caddesi|sok\.?|sokak|bulvar|blv\.?|no[:\s]|kat[:\s]/i.test(String(v||""));
      const isCoarseLocation=v=>/\bmerkez\s*\//i.test(String(v||""))||/^[^/]{2,}\s*\/\s*[^/]{2,}$/i.test(String(v||""));
      const isMobileNumber=v=>{
        const digits=String(v||"").replace(/\D/g,"").replace(/^90/,"0");
        return /^05\d{9}$/.test(digits);
      };

      const storedPhoneMatch=phone.match(/(?:\+?90\s*)?(?:0?\d{3})[\s().-]*\d{3}[\s.-]*\d{2}[\s.-]*\d{2}/);
      if(storedPhoneMatch)phone=storedPhoneMatch[0].trim();

      const phoneMatch=name.match(/(?:\+?90\s*)?(?:0?\d{3})[\s().-]*\d{3}[\s.-]*\d{2}[\s.-]*\d{2}/);
      if(phoneMatch){
        if(!phone)phone=phoneMatch[0].trim();
        const parts=name.split(phoneMatch[0]);
        name=(parts[0]||"").trim();
        if(!address)address=(parts.slice(1).join(" ")||"").trim();
      }

      name=name
        .replace(/\s+-\s+Ehliyet.*$/i,"")
        .replace(/\s+\d{5,}.*$/,"")
        .trim();

      // Eski hızlı kayıtlarda kısa konum yanlışlıkla adres alanına yazılmış olabilir.
      if(address && !isDetailedAddress(address) && isCoarseLocation(address)){
        if(!location)location=address;
        address="";
      }

      d.name=formatFirmTitle(name||d.name||"Firma");
      d.phone=phone;
      const addrLoc=locationFromAddress(address);
      if(addrLoc){
        d.city=addrLoc.city;
        d.district=addrLoc.district;
      }

      // Şehir bilgisini adres/konum/firma adından doğrula.
      // Böylece eski test verisindeki yanlış city değeri ekrana taşınmaz.
      const resolvedCity=resolveProfileCity(d,name,address,location);
      if(resolvedCity){
        const oldCity=String(d.city||"").trim();
        d.city=resolvedCity;
        // Şehir değiştiyse ve ilçe sadece genel "merkez" ise yanlış eski ilçeyi taşıma.
        if(oldCity && oldCity.toLocaleLowerCase("tr-TR")!==resolvedCity.toLocaleLowerCase("tr-TR")
          && /^merkez$/i.test(String(d.district||"").trim())){
          d.district="Merkez";
        }
      }

      // Otomatik oluşturulmuş açıklamalar eski şehir bilgisi taşıyabilir.
      // Bu tip açıklamaları her açılışta güncel il/ilçe bilgisinden yeniden üret.
      const sectorLabels={
        egitim:"eğitim",
        otomotiv:"otomotiv",
        yemeicme:"yeme & içme",
        saglikguzellik:"sağlık & güzellik",
        evyapi:"ev & yapı",
        emlak:"emlak",
        turizm:"turizm & konaklama",
        organizasyonmedya:"organizasyon & medya",
        tasimacilik:"taşımacılık",
        profesyonel:"profesyonel hizmet",
        alisveris:"alışveriş & yerel esnaf",
        diger:"yerel işletme"
      };

      const storedDescription=String(d.description||"").trim();
      const autoDescription=/\bbölgesinde\s+hizmet\s+veren\b/i.test(storedDescription)
        && /\bişletmesidir\.?\s*$/i.test(storedDescription);
      const loc=[d.district,d.city].filter(Boolean).join(", ");

      if(!storedDescription || autoDescription){
        d.description=automaticProfileDescription(d);
      }

      const storedWa=String(d.whatsapp||"").trim();
      const waMatch=storedWa.match(/(?:\+?90\s*)?(?:0?\d{3})[\s().-]*\d{3}[\s.-]*\d{2}[\s.-]*\d{2}/);
      const cleanWa=waMatch?waMatch[0].trim():"";

      // WhatsApp alanına yönetim panelinden özel olarak bir numara girilmişse her zaman göster.
      // Numara 05xx, 5xx veya +90 5xx formatında olabilir.
      d.whatsapp=cleanWa || storedWa;

      d.address=address;
      d.location=location;
      return d;
    }

    function contactRow(icon,label,value,href){
      if(!value) return "";
      const content=href
        ? '<a href="'+esc(href)+'" target="'+(/^http/.test(href)?"_blank":"_self")+'" rel="noopener">'+esc(value)+'</a>'
        : '<span>'+esc(value)+'</span>';

      return '<div class="contact-row">'+
        '<div class="contact-icon">'+icon+'</div>'+
        '<div><small>'+esc(label)+'</small>'+content+'</div>'+
      '</div>';
    }

    function instagramHandle(value){
      let v=String(value||"").trim();
      if(!v)return "";
      v=v.replace(/^https?:\/\/(www\.)?instagram\.com\//i,"");
      v=v.replace(/^instagram\.com\//i,"");
      v=v.replace(/[?#].*$/,"").replace(/\/$/,"").replace(/^@/,"");
      return v ? "@"+v : "";
    }



    function categoryFallback(d){
      const main=String(d.mainCategory||"diger").trim();
      const sub=String(d.subCategory||d.category||"").trim();
      const mainMap={
        egitim:{icon:"🎓",label:"Eğitim",tone:"education"},
        otomotiv:{icon:"🚗",label:"Otomotiv",tone:"automotive"},
        yemeicme:{icon:"🍽️",label:"Yeme & İçme",tone:"food"},
        saglikguzellik:{icon:"✚",label:"Sağlık & Güzellik",tone:"health"},
        evyapi:{icon:"🏠",label:"Ev & Yapı",tone:"home"},
        emlak:{icon:"🏢",label:"Emlak",tone:"estate"},
        turizm:{icon:"🧳",label:"Turizm & Konaklama",tone:"tourism"},
        organizasyonmedya:{icon:"🎬",label:"Organizasyon & Medya",tone:"media"},
        tasimacilik:{icon:"🚚",label:"Taşımacılık",tone:"transport"},
        profesyonel:{icon:"💼",label:"Profesyonel Hizmetler",tone:"professional"},
        alisveris:{icon:"🛍️",label:"Yerel Esnaf",tone:"shopping"},
        diger:{icon:"📍",label:"Yerel İşletme",tone:"other"}
      };
      const subMap={
        surucu:{icon:"🚘",label:"Sürücü Kursu"},
        kres:{icon:"🧸",label:"Kreş & Anaokulu"},
        dershane:{icon:"📚",label:"Kurs Merkezi"},
        yurt:{icon:"🛏️",label:"Öğrenci Yurdu"},
        oto_servis:{icon:"🔧",label:"Oto Servis"},
        ekspertiz:{icon:"🔎",label:"Oto Ekspertiz"},
        restoran:{icon:"🍽️",label:"Restoran"},
        kafe:{icon:"☕",label:"Kafe"}
      };
      const base=mainMap[main]||mainMap.diger;
      const detail=subMap[sub]||{};
      return {icon:detail.icon||base.icon,label:detail.label||base.label,tone:base.tone};
    }

    function profileCoverFallbackMarkup(icon,label,tone){
      return '<div class="profile-cover category-cover '+esc(tone||"other")+'" aria-label="'+esc(label||"Yerel İşletme")+' kategori görseli">'+
        '<div class="category-cover-orb orb-a"></div><div class="category-cover-orb orb-b"></div>'+
        '<div class="category-cover-content"><span class="category-cover-icon">'+(icon||"📍")+'</span><div><small>DİJİYESOR</small><strong>'+esc(label||"Yerel İşletme")+'</strong><span>Firma görseli eklendiğinde bu alan otomatik değişir.</span></div></div>'+
      '</div>';
    }
    function handleProfileCoverError(img){
      const cover=img?.closest?.(".profile-cover");
      if(!cover)return;
      const slide=img.closest?.("[data-cover-slide]");
      if(slide){
        slide.remove();
        const slides=[...cover.querySelectorAll("[data-cover-slide]")];
        if(slides.length){
          slides.forEach((el,index)=>{
            el.dataset.coverSlide=String(index);
            el.classList.toggle("active",index===0);
          });
          const dots=cover.querySelector(".profile-cover-dots");
          if(dots) dots.innerHTML=slides.map((_,index)=>'<button type="button" class="'+(index===0?'active':'')+'" data-cover-dot="'+index+'" aria-label="'+(index+1)+'. görsel"></button>').join("");
          if(slides.length===1) cover.querySelectorAll(".profile-cover-nav,.profile-cover-dots").forEach(el=>el.remove());
          return;
        }
      }
      cover.outerHTML=profileCoverFallbackMarkup(cover.dataset.fallbackIcon,cover.dataset.fallbackLabel,cover.dataset.fallbackTone);
    }
    function handleProfileLogoError(img,initialText){
      const parent=img?.parentElement;
      if(!parent)return;
      const span=document.createElement("span");
      span.textContent=initialText||"D";
      parent.replaceChildren(span);
    }

    function buildProfileCoverSlider(d){
      let images=asArray(d.coverUrls).map(v=>String(v||"").trim()).filter(Boolean);
      if(!images.length){
        images=[d.coverUrl,d.cardImageUrl].map(v=>String(v||"").trim()).filter(Boolean);
      }

      const unique=[...new Set(images)].slice(0,6);
      if(!unique.length)return buildFallbackCover(d);
      const fb=categoryFallback(d);
      const meta=' data-fallback-icon="'+esc(fb.icon)+'" data-fallback-label="'+esc(fb.label)+'" data-fallback-tone="'+esc(fb.tone)+'"';
      if(unique.length===1){
        return '<div class="profile-cover"'+meta+'><img src="'+esc(unique[0])+'" alt="'+esc(d.name||"Firma")+' kapak görseli" onerror="handleProfileCoverError(this)"></div>';
      }

      return '<div class="profile-cover profile-cover-slider" data-cover-slider'+meta+'>'+
        '<div class="profile-cover-track">'+
          unique.map((url,index)=>'<div class="profile-cover-slide'+(index===0?' active':'')+'" data-cover-slide="'+index+'"><img src="'+esc(url)+'" alt="'+esc((d.name||"Firma")+' görsel '+(index+1))+'" onerror="handleProfileCoverError(this)"></div>').join("")+
        '</div>'+
        '<button type="button" class="profile-cover-nav prev" data-cover-prev aria-label="Önceki görsel">‹</button>'+
        '<button type="button" class="profile-cover-nav next" data-cover-next aria-label="Sonraki görsel">›</button>'+
        '<div class="profile-cover-dots">'+
          unique.map((_,index)=>'<button type="button" class="'+(index===0?'active':'')+'" data-cover-dot="'+index+'" aria-label="'+(index+1)+'. görsel"></button>').join("")+
        '</div>'+
      '</div>';
    }

    function buildFallbackCover(d){
      const c=categoryFallback(d);
      return profileCoverFallbackMarkup(c.icon,c.label,c.tone);
    }

    function mapsQueryFor(d){
      return String(d.address||d.googlePlusCode||d.location||[d.district,d.city].filter(Boolean).join(", ")||"").trim();
    }
    function mapsEmbedUrl(query){
      if(!query)return "";
      return "https://www.google.com/maps?q="+encodeURIComponent(query)+"&output=embed";
    }
    function mapsDirectionsUrl(query){
      if(!query)return "";
      return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(query);
    }
    function buildMapSection(d){
      const query=mapsQueryFor(d);
      if(!query)return "";
      return '<section class="section-card map-section">'+
        '<div class="section-title"><div><span>KONUM</span><h2>Harita & Yol Tarifi</h2></div></div>'+
        '<div class="profile-map"><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="'+esc(mapsEmbedUrl(query))+'" title="'+esc((d.name||"Firma")+" haritası")+'"></iframe></div>'+
        '<div class="map-meta">'+
          '<span>'+esc(d.address||d.googlePlusCode||d.location||[d.district,d.city].filter(Boolean).join(" · "))+'</span>'+
          '<a href="'+esc(mapsDirectionsUrl(query))+'" target="_blank" rel="noopener">Yol Tarifi Al</a>'+
        '</div>'+
      '</section>';
    }

    async function loadProfile(){
      if(!id){
        root.innerHTML='<section class="profile-error"><strong>Firma bulunamadı.</strong><a href="arama.html">Aramaya dön</a></section>';
        return;
      }

      try{
        const snap=await db.collection("institutions").doc(id).get();
        if(!snap.exists) throw new Error("not-found");

        const d=normalizeQuickProfileData(snap.data()||{});
        updateProfileSeo(d);

        const profileImage=d.logoUrl||d.profileImageUrl||d.cardImageUrl||"";
        const logo=profileImage
          ? '<img src="'+esc(profileImage)+'" alt="'+esc(d.name||"Firma")+' profil görseli" onerror="handleProfileLogoError(this,\''+esc(initials(d.name))+'\')">'
          : '<span>'+esc(initials(d.name))+'</span>';

        const cover=buildProfileCoverSlider(d);

        const locationText=[d.city,d.district].filter(Boolean).join(" · ") || d.location || "";
        const website=safeUrl(d.website);
        const instagram=d.instagram ? safeUrl(String(d.instagram).includes("instagram.com") ? d.instagram : "instagram.com/"+String(d.instagram).replace(/^@/,"")) : "";
        const phone=telUrl(d.phone);
        const phoneDigits=String(d.phone||"").replace(/\D/g,"").replace(/^90/,"0");
        const isMobilePhone=/^05\d{9}$/.test(phoneDigits);
        const mobileWhatsapp=isMobilePhone?waUrl(d.phone):"";
        const whatsapp=waUrl(d.whatsapp);

        root.innerHTML=
          cover+
          '<section class="profile-hero">'+
            '<div class="profile-logo">'+logo+'</div>'+
            '<div class="profile-main-info">'+
              '<div class="profile-title-row">'+
                '<h1>'+esc(d.name||"Firma")+'</h1>'+
                (d.vip?'<span class="profile-badge">VIP</span>':'')+
                (getTourUrl(d)?'<span class="profile-badge tour">360° TUR</span>':'')+
                (campaignActive(d)?'<span class="profile-badge campaign">KAMPANYA</span>':'')+
              '</div>'+
              (locationText?'<p class="profile-location">📍 '+esc(locationText)+'</p>':'')+

              (d.category||d.mainCategory?'<span class="profile-category">'+esc(d.category||d.mainCategory)+'</span>':'')+
            '</div>'+
            '<div class="hero-actions">'+
              (getTourUrl(d)?'<a class="hero-btn secondary" href="#mekan360">360° Mekânı Gez</a>':'')+
              (phone?'<a class="hero-btn secondary" href="'+esc(phone)+'">Ara</a>':'')+
              (whatsapp?'<a class="hero-btn primary" href="'+esc(whatsapp)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+
              (instagram?'<a class="hero-btn instagram" href="'+esc(instagram)+'" target="_blank" rel="noopener">Instagram</a>':'')+
              '<button type="button" class="hero-btn info bilgi-al-open" data-bilgi-al data-institution-id="'+esc(id)+'" data-institution-name="'+esc(d.name||'')+'" data-main-category="'+esc(d.mainCategory||'')+'" data-sub-category="'+esc(d.subCategory||d.category||'')+'" data-city="'+esc(d.city||'')+'" data-district="'+esc(d.district||'')+'">Bilgi Al</button>'+
            '</div>'+
          '</section>'+

          '<div class="profile-layout">'+
            '<div class="profile-content">'+
              '<section class="section-card">'+
                '<div class="section-title"><div><span>HAKKINDA</span><h2>Firma hakkında</h2></div></div>'+
                '<p class="about-text">'+esc(d.description||"Firma açıklaması henüz eklenmedi.")+'</p>'+
              '</section>'+

              buildCampaignSection(d)+
              (getTourUrl(d)?buildTourSection(d):buildMapSection(d))+
              '<section class="section-card">'+
                '<div class="section-title"><div><span>GALERİ</span><h2>Fotoğraf & Video</h2></div></div>'+
                buildGallery(d)+
              '</section>'+
            '</div>'+

            '<aside id="iletisim" class="contact-card">'+
              '<div class="section-title"><div><span>İLETİŞİM</span><h2>İletişim bilgileri</h2></div></div>'+
              '<div class="contact-list">'+
                contactRow("☎",isMobilePhone?"Cep Telefonu":"Telefon",formatPhoneDisplay(d.phone),isMobilePhone?mobileWhatsapp:phone)+
                contactRow("●","WhatsApp",d.whatsapp,whatsapp)+
                contactRow("⌖","Adres",d.address,"")+
                contactRow("↗","Web sitesi",d.website,website)+
                contactRow("◎","Sosyal Medya",instagramHandle(d.instagram),instagram)+
                (!(d.phone||d.whatsapp||d.address||d.website||d.instagram)?'<div class="contact-empty">İletişim bilgileri henüz eklenmemiş.</div>':'')+
              '</div>'+
              ((phone||whatsapp||instagram)?'<div class="contact-actions">'+
                (phone?'<a href="'+esc(phone)+'" class="contact-action secondary">Telefon Et</a>':'')+
                (whatsapp?'<a href="'+esc(whatsapp)+'" target="_blank" rel="noopener" class="contact-action primary">WhatsApp</a>':'')+
                (instagram?'<a href="'+esc(instagram)+'" target="_blank" rel="noopener" class="contact-action instagram"><svg class="instagram-logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="2"></rect><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"></circle></svg><span>Instagram’da Gör</span></a>':'')+
              '</div>':'')+
            '</aside>'+
          '</div>'+

          '<div id="imageModal" class="image-modal" hidden>'+
            '<button id="closeModal" type="button" aria-label="Kapat">×</button>'+
            '<img id="modalImage" alt="Firma fotoğrafı">'+
          '</div>';

        function initProfileCoverSlider(){
          const slider=document.querySelector("[data-cover-slider]");
          if(!slider)return;
          const slides=[...slider.querySelectorAll("[data-cover-slide]")];
          const dots=[...slider.querySelectorAll("[data-cover-dot]")];
          if(slides.length<2)return;

          let current=0;
          let timer=null;

          const show=index=>{
            current=(index+slides.length)%slides.length;
            slides.forEach((slide,i)=>slide.classList.toggle("active",i===current));
            dots.forEach((dot,i)=>dot.classList.toggle("active",i===current));
          };
          const start=()=>{
            clearInterval(timer);
            timer=setInterval(()=>show(current+1),5000);
          };

          slider.querySelector("[data-cover-prev]")?.addEventListener("click",()=>{show(current-1);start()});
          slider.querySelector("[data-cover-next]")?.addEventListener("click",()=>{show(current+1);start()});
          dots.forEach(dot=>dot.addEventListener("click",()=>{show(Number(dot.dataset.coverDot)||0);start()}));

          let touchStartX=0;
          slider.addEventListener("touchstart",e=>{touchStartX=e.touches[0]?.clientX||0},{passive:true});
          slider.addEventListener("touchend",e=>{
            const endX=e.changedTouches[0]?.clientX||0;
            const diff=endX-touchStartX;
            if(Math.abs(diff)>45){show(diff<0?current+1:current-1);start()}
          },{passive:true});

          slider.addEventListener("mouseenter",()=>clearInterval(timer));
          slider.addEventListener("mouseleave",start);
          start();
        }

        initProfileCoverSlider();

        document.querySelectorAll("[data-image]").forEach(btn=>{
          btn.addEventListener("click",()=>{
            const modal=document.getElementById("imageModal");
            const image=document.getElementById("modalImage");
            image.src=btn.dataset.image;
            modal.hidden=false;
            document.body.classList.add("modal-open");
          });
        });

        const closeModal=()=>{
          const modal=document.getElementById("imageModal");
          if(!modal) return;
          modal.hidden=true;
          document.body.classList.remove("modal-open");
        };


        document.getElementById("closeModal")?.addEventListener("click",closeModal);
        document.getElementById("imageModal")?.addEventListener("click",e=>{
          if(e.target.id==="imageModal") closeModal();
        });
        document.addEventListener("keydown",e=>{
          if(e.key==="Escape") closeModal();
        });

      }catch(e){
        console.error(e);
        root.innerHTML='<section class="profile-error"><strong>Bu firma kaydına ulaşılamadı.</strong><a href="arama.html">Aramaya dön</a></section>';
      }
    }

    document.getElementById("backToSearch")?.addEventListener("click",e=>{
      e.preventDefault();
      // Firma sayfasına arama sonuçlarından gelindiyse tam olarak önceki sayfaya dön.
      if(document.referrer && document.referrer.includes(location.host)){
        history.back();
      }else{
        location.href="arama.html";
      }
    });

    loadProfile();
  </script>
