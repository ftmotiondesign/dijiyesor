<body>
<header class="topbar"><div class="container"><a class="brand" href="index.html"><span class="brand-mark">D</span><span class="brand-name">DijiyeSor</span></a><nav class="nav"><a class="btn btn-soft" href="index.html">Firma Ara</a><a class="btn btn-primary" href="firma-ekle.html">Firmanı Ekle</a></nav></div></header>
<section class="page-hero"><div class="container"><div class="breadcrumb"><a href="index.html">Ana Sayfa</a> / Firma</div><div id="detailHead">Firma bilgileri yükleniyor...</div></div></section>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyD4SHYRiuSuHB-wSl8oWUFMCsfVu6j164E",authDomain:"dijiyer.firebaseapp.com",projectId:"dijiyer",storageBucket:"dijiyer.firebasestorage.app",messagingSenderId:"847787778815",appId:"1:847787778815:web:57058aa8dcc4143ec5a2ca"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const esc=v=>String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const id=new URLSearchParams(location.search).get("id");const head=document.getElementById("detailHead"),root=document.getElementById("detailRoot");
(async()=>{if(!id){head.innerHTML="<h1>Firma bulunamadı</h1>";root.innerHTML='<div class="panel">Geçerli bir firma seçilmedi.</div>';return}
try{const snap=await db.collection("institutions").doc(id).get();if(!snap.exists)throw new Error("not-found");const d=snap.data()||{};document.title=(d.name||"Firma")+" | DijiyeSor";const initials=String(d.name||"Firma").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toLocaleUpperCase("tr-TR");const logo=d.logoUrl?'<img src="'+esc(d.logoUrl)+'" alt="'+esc(d.name)+' logosu">':esc(initials);head.innerHTML='<div class="detail-title"><div class="logo">'+logo+'</div><div><h1>'+esc(d.name||"Firma")+'</h1><p>📍 '+esc([d.city,d.district].filter(Boolean).join(" · ")||d.location||"Konum bilgisi")+'</p></div></div>';root.innerHTML='<section class="panel"><h2>Firma Hakkında</h2><p class="desc" style="min-height:0">'+esc(d.description||"Firma açıklaması henüz eklenmedi.")+'</p><div class="info-list">'+(d.address?'<div class="info-row"><strong>Adres:</strong> '+esc(d.address)+'</div>':'')+(d.website?'<div class="info-row"><strong>Web:</strong> '+esc(d.website)+'</div>':'')+(d.instagram?'<div class="info-row"><strong>Instagram:</strong> '+esc(d.instagram)+'</div>':'')+'</div></section><aside id="iletisim" class="panel"><h2>İletişim</h2><div class="info-list">'+(d.phone?'<div class="info-row"><strong>Telefon:</strong> '+esc(d.phone)+'</div>':'')+(d.whatsapp||d.phone?'<a class="btn btn-primary" target="_blank" rel="noopener" href="https://wa.me/90'+String(d.whatsapp||d.phone).replace(/\D/g,"").replace(/^90/,"").replace(/^0/,"")+'">WhatsApp</a>':'')+'</div></aside>'}catch(e){head.innerHTML="<h1>Firma bulunamadı</h1>";root.innerHTML='<div class="panel">Bu firma kaydına ulaşılamadı.</div>'}})();
</script></body></html>
