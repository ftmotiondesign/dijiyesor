<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Firma | DijiyeSor</title>
  <meta name="description" content="DijiyeSor firma tanıtım sayfası.">
  <link rel="stylesheet" href="firma.css?v=20261003-13">
  <link rel="stylesheet" href="bilgi-modal.css">
</head>
<body>
  <header class="profile-topbar">
    <a class="profile-brand" href="index.html">
      <span class="profile-brand-mark">D</span>
      <span>DijiyeSor</span>
    </a>
    <a class="back-search" href="arama.html">← Firma Ara</a>
  </header>

  <main id="profileRoot" class="profile-page">
    <section class="profile-loading">
      <strong>Firma bilgileri yükleniyor...</strong>
    </section>
  </main>

  <footer class="profile-footer">© 2026 DijiyeSor</footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig={
      apiKey:"AIzaSyD4SHYRiuSuHB-wSl8oWUFMCsfVu6j164E",
      authDomain:"dijiyer.firebaseapp.com",
      projectId:"dijiyer",
      storageBucket:"dijiyer.firebasestorage.app",
      messagingSenderId:"847787778815",
      appId:"1:847787778815:web:57058aa8dcc4143ec5a2ca"
    };

    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db=firebase.firestore();

    const root=document.getElementById("profileRoot");
    const id=new URLSearchParams(location.search).get("id");

    const esc=v=>String(v||"").replace(/[&<>"']/g,m=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));

    const safeUrl=value=>{
      let v=String(value||"").trim();
      if(!v) return "";
      if(/^https?:\/\//i.test(v)) return v;
      return "https://"+v;
    };

    const telUrl=value=>{
      const digits=String(value||"").replace(/[^\d+]/g,"");
      return digits ? "tel:"+digits : "";
    };

    const waUrl=value=>{
      let digits=String(value||"").replace(/\D/g,"");
      digits=digits.replace(/^90/,"").replace(/^0/,"");
      return digits ? "https://wa.me/90"+digits : "";
    };

    const initials=name=>String(name||"Firma")
      .split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("")
      .toLocaleUpperCase("tr-TR");

    const asArray=value=>Array.isArray(value) ? value.filter(Boolean) : (value ? [value] : []);

    function getTourUrl(d){
      return String(d.tour360Url||d.virtualTourUrl||d.tour360||d.panoramaUrl||"").trim();
    }

    function campaignActive(d){
      const active=Boolean(d.campaignActive||d.hasCampaign);
      const title=String(d.campaignTitle||d.promotionTitle||"").trim();
      if(!active||!title)return false;
      const end=d.campaignEnd||d.campaignEndDate||"";
      if(end){
        const date=new Date(end);
        if(!Number.isNaN(date.getTime()) && date.getTime()<Date.now())return false;
      }
      return true;
    }

    function buildCampaignSection(d){
      if(!campaignActive(d))return "";
      const title=d.campaignTitle||d.promotionTitle||"";
      const text=d.campaignText||d.campaignDescription||d.promotionText||"";
      const badge=d.campaignBadge||d.promotionBadge||"Güncel Kampanya";
      const end=d.campaignEnd||d.campaignEndDate||"";
      const image=safeUrl(d.campaignImageUrl||d.promotionImageUrl||"");
      const link=safeUrl(d.campaignUrl||d.promotionUrl||"");
      return '<section class="section-card campaign-section" id="kampanya">'+
        '<div class="campaign-kicker">GÜNCEL KAMPANYA</div>'+
        '<div class="campaign-layout">'+
          (image?'<img class="campaign-image" src="'+esc(image)+'" alt="'+esc(title)+'">':'')+
          '<div class="campaign-content">'+
            '<span class="campaign-pill">'+esc(badge)+'</span>'+
            '<h2>'+esc(title)+'</h2>'+
            (text?'<p>'+esc(text)+'</p>':'')+
            (end?'<small>Son tarih: '+esc(new Date(end).toLocaleDateString("tr-TR"))+'</small>':'')+
            (link?'<a href="'+esc(link)+'" target="_blank" rel="noopener">Kampanyayı İncele ↗</a>':'')+
          '</div>'+
        '</div>'+
      '</section>';
    }

    function buildTourSection(d){
      const raw=getTourUrl(d);
      if(!raw)return "";
      const url=safeUrl(raw);
      if(!url)return "";

      return '<section class="section-card tour-section">'+
        '<div class="section-title"><div><span>360° MEKAN TURU</span><h2>Mekanı sanal olarak gez</h2></div></div>'+
        '<p class="tour-copy">Mekanı farklı noktalardan inceleyebilir, gelmeden önce ortamı keşfedebilirsin.</p>'+
        '<div class="tour-preview">'+
          '<iframe src="'+esc(url)+'" title="'+esc((d.name||"Firma")+' 360 derece mekan turu')+'" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>'+
        '</div>'+
        '<a class="tour-open-btn" href="'+esc(url)+'" target="_blank" rel="noopener">360° Mekanı Gez ↗</a>'+
      '</section>';
    }

    function youtubeEmbed(url){
      const value=String(url||"");
      let match=value.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{6,})/);
      if(match) return "https://www.youtube.com/embed/"+match[1];
      return "";
    }

    function buildGallery(d){
      const photos=[
        ...asArray(d.galleryUrls),
        ...asArray(d.photos),
        ...asArray(d.photoUrls)
      ].filter(Boolean);

      const videos=[
        ...asArray(d.videoUrls),
        ...asArray(d.videos),
        d.videoUrl,
        d.youtubeUrl,
        d.promoVideoUrl
      ].filter(Boolean);

      const items=[];

      photos.slice(0,12).forEach((url,index)=>{
        items.push(
          '<button class="media-card photo-card" type="button" data-image="'+esc(url)+'" aria-label="Fotoğrafı büyüt">'+
            '<img src="'+esc(url)+'" alt="'+esc((d.name||"Firma")+" fotoğraf "+(index+1))+'" loading="lazy">'+
          '</button>'
        );
      });

      videos.slice(0,4).forEach(url=>{
        const embed=youtubeEmbed(url);
        if(embed){
          items.push(
            '<div class="media-card video-card">'+
              '<iframe src="'+esc(embed)+'" title="Firma videosu" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>'+
            '</div>'
          );
        }else{
          items.push(
            '<div class="media-card video-card">'+
              '<video controls preload="metadata"><source src="'+esc(url)+'"></video>'+
            '</div>'
          );
        }
      });

      if(!items.length){
        return '<div class="empty-media"><div class="empty-media-icon">📷</div><strong>Fotoğraf ve video henüz eklenmemiş.</strong><span>Firma görselleri eklendiğinde burada görüntülenecek.</span></div>';
      }

      return '<div class="media-grid">'+items.join("")+'</div>';
    }

    function normalizeQuickProfileData(data){
      const d={...data};
      let name=String(d.name||"Firma").trim();
      let phone=String(d.phone||"").trim();
      let address=String(d.address||"").trim();

      const storedPhoneMatch=phone.match(/(?:\+?90\s*)?(?:0?\d{3})[\s().-]*\d{3}[\s.-]*\d{2}[\s.-]*\d{2}/);
      if(storedPhoneMatch)phone=storedPhoneMatch[0].trim();

      const phoneMatch=name.match(/(?:\+?90\s*)?(?:0?\d{3})[\s().-]*\d{3}[\s.-]*\d{2}[\s.-]*\d{2}/);
      if(phoneMatch){
        if(!phone)phone=phoneMatch[0].trim();
        const parts=name.split(phoneMatch[0]);
        name=(parts[0]||"").trim();
        if(!address)address=(parts.slice(1).join(" ")||"").trim();
      }

      name=name
        .replace(/\s+-\s+Ehliyet.*$/i,"")
        .replace(/\s+\d{5,}.*$/,"")
        .trim();

      if(!d.description){
        const sectorLabels={
          egitim:"eğitim",
          otomotiv:"otomotiv",
          yemeicme:"yeme & içme",
          saglikguzellik:"sağlık & güzellik",
          evyapi:"ev & yapı",
          emlak:"emlak",
          turizm:"turizm & konaklama",
          organizasyonmedya:"organizasyon & medya",
          tasimacilik:"taşımacılık",
          profesyonel:"profesyonel hizmet",
          alisveris:"alışveriş & yerel esnaf",
          diger:"yerel işletme"
        };
        const loc=[d.district,d.city].filter(Boolean).join(", ");
        d.description=loc
          ? name+"; "+loc+" bölgesinde hizmet veren "+(sectorLabels[d.mainCategory]||"yerel")+" işletmesidir."
          : name+" hakkında temel firma bilgileri DijiyeSor üzerinden görüntülenebilir.";
      }

      d.name=name||d.name||"Firma";
      d.phone=phone;
      const storedWa=String(d.whatsapp||"").trim();
      const waMatch=storedWa.match(/(?:\+?90\s*)?(?:0?\d{3})[\s().-]*\d{3}[\s.-]*\d{2}[\s.-]*\d{2}/);
      d.whatsapp=waMatch?waMatch[0].trim():(phone||storedWa);
      d.address=address;
      return d;
    }

    function contactRow(icon,label,value,href){
      if(!value) return "";
      const content=href
        ? '<a href="'+esc(href)+'" target="'+(/^http/.test(href)?"_blank":"_self")+'" rel="noopener">'+esc(value)+'</a>'
        : '<span>'+esc(value)+'</span>';

      return '<div class="contact-row">'+
        '<div class="contact-icon">'+icon+'</div>'+
        '<div><small>'+esc(label)+'</small>'+content+'</div>'+
      '</div>';
    }

    async function loadProfile(){
      if(!id){
        root.innerHTML='<section class="profile-error"><strong>Firma bulunamadı.</strong><a href="arama.html">Aramaya dön</a></section>';
        return;
      }

      try{
        const snap=await db.collection("institutions").doc(id).get();
        if(!snap.exists) throw new Error("not-found");

        const d=normalizeQuickProfileData(snap.data()||{});
        document.title=(d.name||"Firma")+" | DijiyeSor";

        const logo=d.logoUrl
          ? '<img src="'+esc(d.logoUrl)+'" alt="'+esc(d.name||"Firma")+' logosu">'
          : '<span>'+esc(initials(d.name))+'</span>';

        const cover=d.coverUrl
          ? '<div class="profile-cover"><img src="'+esc(d.coverUrl)+'" alt="'+esc(d.name||"Firma")+' kapak görseli"></div>'
          : '';

        const locationText=[d.city,d.district].filter(Boolean).join(" · ") || d.location || "";
        const website=safeUrl(d.website);
        const instagram=d.instagram ? safeUrl(String(d.instagram).includes("instagram.com") ? d.instagram : "instagram.com/"+String(d.instagram).replace(/^@/,"")) : "";
        const phone=telUrl(d.phone);
        const whatsapp=waUrl(d.whatsapp||d.phone);

        root.innerHTML=
          cover+
          '<section class="profile-hero">'+
            '<div class="profile-logo">'+logo+'</div>'+
            '<div class="profile-main-info">'+
              '<div class="profile-title-row">'+
                '<h1>'+esc(d.name||"Firma")+'</h1>'+
                (d.vip?'<span class="profile-badge">VIP</span>':'')+
                (getTourUrl(d)?'<span class="profile-badge tour">360° TUR</span>':'')+
                (campaignActive(d)?'<span class="profile-badge campaign">KAMPANYA</span>':'')+
              '</div>'+
              (locationText?'<p class="profile-location">📍 '+esc(locationText)+'</p>':'')+
              (d.category||d.mainCategory?'<span class="profile-category">'+esc(d.category||d.mainCategory)+'</span>':'')+
            '</div>'+
            '<div class="hero-actions">'+
              (phone?'<a class="hero-btn secondary" href="'+esc(phone)+'">Ara</a>':'')+
              (whatsapp?'<a class="hero-btn primary" href="'+esc(whatsapp)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+
              '<button type="button" class="hero-btn info bilgi-al-open" data-bilgi-al data-institution-id="'+esc(id)+'" data-institution-name="'+esc(d.name||'')+'" data-main-category="'+esc(d.mainCategory||'')+'" data-sub-category="'+esc(d.subCategory||d.category||'')+'" data-city="'+esc(d.city||'')+'" data-district="'+esc(d.district||'')+'">Bilgi Al</button>'+
            '</div>'+
          '</section>'+

          '<div class="profile-layout">'+
            '<div class="profile-content">'+
              '<section class="section-card">'+
                '<div class="section-title"><div><span>HAKKINDA</span><h2>Firma hakkında</h2></div></div>'+
                '<p class="about-text">'+esc(d.description||"Firma açıklaması henüz eklenmedi.")+'</p>'+
              '</section>'+

              buildCampaignSection(d)+
              buildTourSection(d)+
              '<section class="section-card">'+
                '<div class="section-title"><div><span>GALERİ</span><h2>Fotoğraf & Video</h2></div></div>'+
                buildGallery(d)+
              '</section>'+
            '</div>'+

            '<aside id="iletisim" class="contact-card">'+
              '<div class="section-title"><div><span>İLETİŞİM</span><h2>İletişim bilgileri</h2></div></div>'+
              '<div class="contact-list">'+
                contactRow("☎","Telefon",d.phone,phone)+
                contactRow("●","WhatsApp",d.whatsapp||d.phone,whatsapp)+
                contactRow("⌖","Adres",d.address,"")+
                contactRow("↗","Web sitesi",d.website,website)+
                contactRow("◎","Instagram",d.instagram,instagram)+
                (!(d.phone||d.whatsapp||d.address||d.website||d.instagram)?'<div class="contact-empty">İletişim bilgileri henüz eklenmemiş.</div>':'')+
              '</div>'+
              ((phone||whatsapp)?'<div class="contact-actions">'+
                (phone?'<a href="'+esc(phone)+'" class="contact-action secondary">Telefon Et</a>':'')+
                (whatsapp?'<a href="'+esc(whatsapp)+'" target="_blank" rel="noopener" class="contact-action primary">WhatsApp</a>':'')+
              '</div>':'')+
            '</aside>'+
          '</div>'+

          '<div id="imageModal" class="image-modal" hidden>'+
            '<button id="closeModal" type="button" aria-label="Kapat">×</button>'+
            '<img id="modalImage" alt="Firma fotoğrafı">'+
          '</div>';

        document.querySelectorAll("[data-image]").forEach(btn=>{
          btn.addEventListener("click",()=>{
            const modal=document.getElementById("imageModal");
            const image=document.getElementById("modalImage");
            image.src=btn.dataset.image;
            modal.hidden=false;
            document.body.classList.add("modal-open");
          });
        });

        const closeModal=()=>{
          const modal=document.getElementById("imageModal");
          if(!modal) return;
          modal.hidden=true;
          document.body.classList.remove("modal-open");
        };

        document.getElementById("closeModal")?.addEventListener("click",closeModal);
        document.getElementById("imageModal")?.addEventListener("click",e=>{
          if(e.target.id==="imageModal") closeModal();
        });
        document.addEventListener("keydown",e=>{
          if(e.key==="Escape") closeModal();
        });

      }catch(e){
        console.error(e);
        root.innerHTML='<section class="profile-error"><strong>Bu firma kaydına ulaşılamadı.</strong><a href="arama.html">Aramaya dön</a></section>';
      }
    }

    loadProfile();
  </script>
  <script src="bilgi-modal.js"></script>
</body>
</html>
