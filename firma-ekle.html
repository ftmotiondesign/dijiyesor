<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firmanı Ekle | DijiyeSor</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><div class="container"><a class="brand" href="index.html"><span class="brand-mark">D</span><span class="brand-name">DijiyeSor</span></a><nav class="nav"><a class="btn btn-soft" href="index.html">Firma Ara</a></nav></div></header>
<section class="page-hero"><div class="container"><div class="eyebrow">DİJİYESOR · FİRMA BAŞVURUSU</div><h1 style="margin:10px 0 8px">Firmanı DijiyeSor’a ekle</h1><p style="color:#6d7890;margin:0">Temel bilgileri gönder. Başvurun incelendikten sonra firma profili yayına alınabilir.</p></div></section>
<main class="container" style="padding:30px 0 52px"><section class="panel" style="max-width:820px;margin:auto">
<div id="message" class="notice hidden"></div>
<form id="form" class="form">
<div class="form-grid"><label class="label">Firma adı<input id="name" class="field" required></label><label class="label">Sektör<select id="mainCategory" class="field" required><option value="">Seçin</option><option value="egitim">Eğitim</option><option value="otomotiv">Otomotiv</option><option value="yemeicme">Yeme & İçme</option><option value="saglikguzellik">Sağlık & Güzellik</option><option value="evyapi">Ev & Yapı</option><option value="emlak">Emlak</option><option value="turizm">Turizm</option><option value="organizasyonmedya">Organizasyon & Medya</option><option value="tasimacilik">Taşımacılık</option><option value="profesyonel">Profesyonel Hizmetler</option><option value="alisveris">Yerel Esnaf</option><option value="diger">Diğer</option></select></label></div>
<div class="form-grid"><label class="label">Alt kategori<select id="subCategory" class="field" required disabled><option value="">Önce sektör seçin</option></select></label><label class="label">İl<select id="city" class="field" required><option value="">İl seçin</option></select></label><label class="label">İlçe<select id="district" class="field" required disabled><option value="">Önce il seçin</option></select></label></div>
<label class="label">Adres<input id="address" class="field" required></label>
<div class="form-grid"><label class="label">Telefon<input id="phone" class="field" required placeholder="05xx xxx xx xx"></label><label class="label">Web sitesi<input id="website" class="field" placeholder="https://..."></label></div>
<label class="label">Kısa açıklama<textarea id="description" class="field" placeholder="Firmanızı ve verdiğiniz hizmetleri kısaca anlatın."></textarea></label>
<button class="btn btn-primary" type="submit">Başvuruyu Gönder</button>
</form></section></main>
<footer class="footer"><div class="container">© 2026 DijiyeSor</div></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyD4SHYRiuSuHB-wSl8oWUFMCsfVu6j164E",authDomain:"dijiyer.firebaseapp.com",projectId:"dijiyer",storageBucket:"dijiyer.firebasestorage.app",messagingSenderId:"847787778815",appId:"1:847787778815:web:57058aa8dcc4143ec5a2ca"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const city=document.getElementById("city"),district=document.getElementById("district"),msg=document.getElementById("message"),mainCategory=document.getElementById("mainCategory"),subCategory=document.getElementById("subCategory");
const subcategoryOptions={"egitim":[["kres","Kreş / Anaokulu"],["dershane","Dershane / Kurs Merkezi"],["surucu","Sürücü Kursu"],["ozel_ders","Özel Ders"],["dil_kursu","Dil Kursu"],["etut","Etüt Merkezi"],["ozel_okul","Özel Okul"],["yurt","Öğrenci Yurdu"]],"otomotiv":[["oto_servis","Oto Servis"],["kaporta_boya","Kaporta & Boya"],["oto_elektrik","Oto Elektrik"],["lastik_jant","Lastik & Jant"],["oto_yikama","Oto Yıkama"],["ekspertiz","Ekspertiz"],["galeri","Oto Galeri"],["rentacar","Rent a Car"],["yedek_parca","Yedek Parça"],["motosiklet","Motosiklet"]],"yemeicme":[["restoran","Restoran"],["kafe","Kafe"],["fastfood","Fast Food"],["pastane","Pastane"],["pizza","Pizza"],["doner","Döner"],["pide_lahmacun","Pide & Lahmacun"],["catering","Catering"],["ev_yemekleri","Ev Yemekleri"]],"saglikguzellik":[["dis_klinigi","Diş Kliniği"],["klinik","Klinik"],["psikolog","Psikolog"],["diyetisyen","Diyetisyen"],["fizyoterapi","Fizyoterapi"],["guzellik","Güzellik Merkezi"],["kuafor","Kuaför"],["berber","Berber"],["spor","Spor Merkezi"]],"evyapi":[["mobilya","Mobilya"],["dekorasyon","Dekorasyon"],["insaat","İnşaat"],["elektrikci","Elektrikçi"],["tesisatci","Tesisatçı"],["teknik_servis","Teknik Servis"],["klima","Klima"],["cam_balkon","Cam Balkon"],["temizlik","Temizlik"]],"emlak":[["emlak_ofisi","Emlak Ofisi"],["konut","Konut"],["arsa","Arsa"],["ticari","Ticari Gayrimenkul"],["gunluk_kiralik","Günlük Kiralık"]],"turizm":[["otel","Otel"],["pansiyon","Pansiyon"],["apart","Apart"],["bungalov","Bungalov"],["seyahat","Seyahat Acentesi"],["kamp","Kamp"]],"organizasyonmedya":[["dugun_salonu","Düğün Salonu"],["organizasyon","Organizasyon"],["fotograf","Fotoğrafçı"],["video","Video Prodüksiyon"],["drone","Drone Çekimi"],["gelinlik","Gelinlik"],["cicekci","Çiçekçi"],["reklam","Reklam Ajansı"]],"tasimacilik":[["nakliyat","Nakliyat"],["kurye","Kurye"],["sehirici","Şehir İçi Taşımacılık"],["depolama","Depolama"]],"profesyonel":[["hukuk","Hukuk"],["muhasebe","Muhasebe"],["web","Web Tasarım"],["sosyal_medya","Sosyal Medya"],["teknoloji","Teknoloji"],["bilgisayar","Bilgisayar"],["danismanlik","Danışmanlık"],["veteriner","Veteriner"],["tarim","Tarım"]],"alisveris":[["giyim","Giyim"],["ayakkabi","Ayakkabı"],["market","Market"],["elektronik","Elektronik"],["kirtasiye","Kırtasiye"],["petshop","Pet Shop"],["zuccaciye","Züccaciye"],["esnaf","Yerel Esnaf"]],"diger":[["diger","Diğer"]]};
function fillSubCategory(){const list=subcategoryOptions[mainCategory.value]||[];subCategory.innerHTML='<option value="">Alt kategori seçin</option>';list.forEach(([value,label])=>{const o=document.createElement("option");o.value=value;o.textContent=label;subCategory.appendChild(o)});subCategory.disabled=!mainCategory.value}
mainCategory.addEventListener("change",fillSubCategory);
(async()=>{try{const r=await fetch("https://api.turkiyeapi.dev/v2/provinces?fields=id,name&limit=81");const j=await r.json();city.innerHTML='<option value="">İl seçin</option>';j.data.sort((a,b)=>a.name.localeCompare(b.name,"tr")).forEach(c=>{const o=document.createElement("option");o.value=c.name;o.textContent=c.name;o.dataset.id=c.id;city.appendChild(o)})}catch(_){}})();
city.addEventListener("change",async()=>{district.disabled=true;district.innerHTML='<option>İlçeler yükleniyor...</option>';const id=city.options[city.selectedIndex]?.dataset?.id;if(!id){district.innerHTML='<option value="">Önce il seçin</option>';return}try{const r=await fetch("https://api.turkiyeapi.dev/v2/provinces/"+id+"/districts?fields=id,name&limit=100");const j=await r.json();district.innerHTML='<option value="">İlçe seçin</option>';j.data.sort((a,b)=>a.name.localeCompare(b.name,"tr")).forEach(d=>{const o=document.createElement("option");o.value=d.name;o.textContent=d.name;district.appendChild(o)});district.disabled=false}catch(_){district.innerHTML='<option value="">İlçeler alınamadı</option>'}});
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;msg.className="notice";msg.textContent="Başvuru gönderiliyor...";try{await db.collection("institutionApplications").add({name:document.getElementById("name").value.trim(),mainCategory:mainCategory.value,subCategory:subCategory.value,category:subCategory.value||mainCategory.value,city:city.value,district:district.value,address:document.getElementById("address").value.trim(),phone:document.getElementById("phone").value.trim(),website:document.getElementById("website").value.trim(),description:document.getElementById("description").value.trim(),date:new Date().toISOString(),source:"dijiyesor-site"});msg.className="notice success";msg.textContent="Başvurunuz alındı. Teşekkür ederiz.";e.target.reset();subCategory.disabled=true;subCategory.innerHTML='<option value="">Önce sektör seçin</option>';district.disabled=true;district.innerHTML='<option value="">Önce il seçin</option>'}catch(err){console.error(err);msg.className="notice error";msg.textContent="Başvuru gönderilemedi. Lütfen daha sonra tekrar deneyin."}finally{btn.disabled=false}});
</script></body></html>
