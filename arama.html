<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arama Sonuçları | DijiyeSor</title>
  <meta name="description" content="DijiyeSor firma arama sonuçları.">
  <link rel="stylesheet" href="arama.css">
  <link rel="stylesheet" href="bilgi-modal.css">
</head>
<body>
  <header class="top">
    <a href="index.html" class="brand">
      <span class="brand-mark">D</span>
      <span>DijiyeSor</span>
    </a>
    <a href="firma-ekle.html" class="add-link">Firmanı Tanıt</a>
  </header>

  <main class="page">
    <section class="search-area">
      <div class="search-line">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Firma, kurum veya hizmet ara...">
        <button id="searchBtn" type="button">Ara</button>
      </div>

      <div class="filters">
        <select id="citySelect"><option value="">Tüm İller</option></select>
        <select id="districtSelect" disabled><option value="">Tüm İlçeler</option></select>
        <select id="sectorSelect">
          <option value="">Tüm Sektörler</option>
          <option value="egitim">Eğitim</option>
          <option value="otomotiv">Otomotiv</option>
          <option value="yemeicme">Yeme & İçme</option>
          <option value="saglikguzellik">Sağlık & Güzellik</option>
          <option value="evyapi">Ev & Yapı</option>
          <option value="emlak">Emlak</option>
          <option value="turizm">Turizm & Konaklama</option>
          <option value="organizasyonmedya">Organizasyon & Medya</option>
          <option value="tasimacilik">Taşımacılık & Teslimat</option>
          <option value="profesyonel">Profesyonel Hizmetler</option>
          <option value="alisveris">Alışveriş & Yerel Esnaf</option>
          <option value="diger">Diğer</option>
        </select>
        <select id="subCategorySelect" disabled><option value="">Tüm Alt Kategoriler</option></select>
        <button id="clearFiltersBtn" class="clear-btn" type="button">Temizle</button>
      </div>
    </section>

    <section class="results-head">
      <div>
        <h1 id="resultsTitle">Arama sonuçları</h1>
        <p id="resultsContext">Aramana uygun işletmeler listeleniyor.</p>
      </div>
      <div id="resultSummary" class="count">Firmalar yükleniyor...</div>
    </section>

    <section id="companyGrid" class="results-grid">
      <div class="results-state">
        <strong>Firmalar yükleniyor</strong>
        <span>Lütfen kısa bir süre bekleyin.</span>
      </div>
    </section>
  </main>

  <footer class="footer">© 2026 DijiyeSor</footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="app.js?v=20261003-19"></script>
  <script src="bilgi-modal.js"></script>
</body>
</html>
