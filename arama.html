<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arama Sonuçları | DijiyeSor</title>
<meta name="description" content="DijiyeSor firma arama sonuçları.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div class="container">
  <a class="brand" href="index.html"><span class="brand-mark">D</span><span class="brand-name">DijiyeSor</span></a>
  <nav class="nav"><a class="btn btn-soft" href="index.html">Yeni Arama</a><a class="btn btn-primary" href="firma-ekle.html">Firmanı Ekle</a></nav>
</div></header>

<section class="hero" style="padding:34px 0 28px"><div class="container"><div class="hero-copy" style="max-width:100%">
  <div class="search-box" style="margin-top:0">
    <div class="search-grid">
      <input id="searchInput" class="field search-main" type="search" autocomplete="off" placeholder="Firma, sektör veya hizmet ara...">
      <select id="citySelect" class="field"><option value="">Tüm İller</option></select>
      <select id="districtSelect" class="field" disabled><option value="">Tüm İlçeler</option></select>
      <select id="sectorSelect" class="field">
        <option value="">Tüm Sektörler</option><option value="egitim">Eğitim</option><option value="otomotiv">Otomotiv</option>
        <option value="yemeicme">Yeme & İçme</option><option value="saglikguzellik">Sağlık & Güzellik</option>
        <option value="evyapi">Ev & Yapı</option><option value="emlak">Emlak</option><option value="turizm">Turizm & Konaklama</option>
        <option value="organizasyonmedya">Organizasyon & Medya</option><option value="tasimacilik">Taşımacılık & Teslimat</option>
        <option value="profesyonel">Profesyonel Hizmetler</option><option value="alisveris">Alışveriş & Yerel Esnaf</option><option value="diger">Diğer</option>
      </select>
      <button id="searchBtn" class="search-btn">Ara</button>
    </div>
  </div>
</div></div></section>

<main class="section"><div class="container">
  <div class="section-head"><div><h2>Arama sonuçları</h2><p>Aramana uygun kayıtlı işletmeler.</p></div></div>
  <div id="resultSummary" class="summary">Firmalar yükleniyor...</div>
  <div id="companyGrid" class="grid"><div class="state"><strong>Firmalar yükleniyor</strong>Lütfen kısa bir süre bekleyin.</div></div>
</div></main>

<footer class="footer"><div class="container">© 2026 DijiyeSor</div></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body></html>
