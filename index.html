<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DijiyeSor | Firma Ara</title>
  <meta name="description" content="DijiyeSor ile firma, kurum, sektör veya hizmet ara.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="mini-brand" href="index.html" aria-label="DijiyeSor ana sayfa">
      <span class="mini-brand-mark">D</span>
      <span>DijiyeSor</span>
    </a>
    <a class="top-link" href="firma-ekle.html">Firmanı Tanıt</a>
  </header>

  <main class="home-main">
    <section class="search-center">
      <img class="mascot" src="assets/diji-mascot.webp" alt="DijiyeSor maskotu">

      <div class="search-box">
        <div class="search-main" id="searchMain">
          <span class="search-icon">⌕</span>
          <input id="homeSearchInput" type="search" autocomplete="off" placeholder="Firma, kurum veya hizmet ara..." aria-autocomplete="list" aria-controls="searchSuggestions">
          <button id="homeSearchBtn" type="button">Ara</button>
        </div>

        <div class="search-suggestions hidden" id="searchSuggestions" role="listbox"></div>

        <div class="location-row">
          <label class="location-field">
            <span>📍</span>
            <select id="homeCitySelect" aria-label="İl seç">
              <option value="">Tüm Türkiye</option>
            </select>
          </label>
          <label class="location-field">
            <span>⌖</span>
            <select id="homeDistrictSelect" aria-label="İlçe seç" disabled>
              <option value="">Tüm İlçeler</option>
            </select>
          </label>
        </div>

        <div class="search-help">Firma adı, sektör ya da hizmet yazarak arayabilirsin.</div>
      </div>
    </section>
  </main>

  <footer class="home-footer">
    <span>© 2026 DijiyeSor</span>
    <a href="firma-ekle.html">Firmanı ekle</a>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD4SHYRiuSuHB-wSl8oWUFMCsfVu6j164E",
      authDomain: "dijiyer.firebaseapp.com",
      projectId: "dijiyer",
      storageBucket: "dijiyer.firebasestorage.app",
      messagingSenderId: "847787778815",
      appId: "1:847787778815:web:57058aa8dcc4143ec5a2ca"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const searchInput = document.getElementById('homeSearchInput');
    const searchBtn = document.getElementById('homeSearchBtn');
    const citySelect = document.getElementById('homeCitySelect');
    const districtSelect = document.getElementById('homeDistrictSelect');
    const suggestions = document.getElementById('searchSuggestions');
    const searchMain = document.getElementById('searchMain');

    let institutions = [];
    let activeSuggestion = -1;

    function normalize(value) {
      return String(value || '').toLocaleLowerCase('tr-TR').trim();
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      }[ch]));
    }

    async function loadCities() {
      try {
        const response = await fetch('https://api.turkiyeapi.dev/v2/provinces?fields=id,name&limit=81');
        if (!response.ok) throw new Error('İller alınamadı');
        const result = await response.json();

        citySelect.innerHTML = '<option value="">Tüm Türkiye</option>';
        (result.data || [])
          .sort((a, b) => a.name.localeCompare(b.name, 'tr'))
          .forEach(city => {
            const option = document.createElement('option');
            option.value = city.name;
            option.textContent = city.name;
            option.dataset.id = city.id;
            citySelect.appendChild(option);
          });
      } catch (_) {
        citySelect.innerHTML = '<option value="">Tüm Türkiye</option>';
      }
    }

    async function loadDistricts() {
      const provinceId = citySelect.options[citySelect.selectedIndex]?.dataset?.id;
      districtSelect.disabled = true;
      districtSelect.innerHTML = '<option value="">Tüm İlçeler</option>';
      if (!provinceId) return;

      try {
        const response = await fetch(
          'https://api.turkiyeapi.dev/v2/provinces/' + provinceId + '/districts?fields=id,name&limit=100'
        );
        if (!response.ok) throw new Error('İlçeler alınamadı');
        const result = await response.json();

        (result.data || [])
          .sort((a, b) => a.name.localeCompare(b.name, 'tr'))
          .forEach(district => {
            const option = document.createElement('option');
            option.value = district.name;
            option.textContent = district.name;
            districtSelect.appendChild(option);
          });

        districtSelect.disabled = false;
      } catch (_) {
        districtSelect.disabled = false;
      }
    }

    async function loadInstitutions() {
      try {
        const snapshot = await db.collection('institutions').get();
        institutions = [];
        snapshot.forEach(doc => {
          const data = doc.data() || {};
          if (String(data.status || 'active') === 'passive') return;
          institutions.push({
            id: doc.id,
            name: data.name || 'Firma',
            city: data.city || '',
            district: data.district || '',
            category: data.mainCategory || data.subCategory || data.category || '',
            description: data.description || ''
          });
        });
      } catch (_) {
        institutions = [];
      }
    }

    function getMatches() {
      const q = normalize(searchInput.value);
      if (q.length < 2) return [];

      const city = normalize(citySelect.value);
      const district = normalize(districtSelect.value);

      return institutions
        .filter(item => {
          const haystack = normalize([
            item.name,
            item.city,
            item.district,
            item.category,
            item.description
          ].join(' '));

          return haystack.includes(q)
            && (!city || normalize(item.city) === city)
            && (!district || normalize(item.district) === district);
        })
        .slice(0, 6);
    }

    function hideSuggestions() {
      suggestions.classList.add('hidden');
      suggestions.innerHTML = '';
      activeSuggestion = -1;
      searchMain.classList.remove('suggestions-open');
    }

    function renderSuggestions() {
      const matches = getMatches();

      if (!matches.length) {
        hideSuggestions();
        return;
      }

      suggestions.innerHTML = matches.map((item, index) => {
        const location = [item.city, item.district].filter(Boolean).join(' · ');
        return `
          <button type="button" class="suggestion-item" data-index="${index}" data-id="${escapeHtml(item.id)}">
            <span class="suggestion-icon">🏢</span>
            <span class="suggestion-copy">
              <strong>${escapeHtml(item.name)}</strong>
              <small>${escapeHtml(location || 'Konum bilgisi')}</small>
            </span>
            <span class="suggestion-arrow">→</span>
          </button>
        `;
      }).join('');

      suggestions.classList.remove('hidden');
      searchMain.classList.add('suggestions-open');
      activeSuggestion = -1;
    }

    function openInstitution(id) {
      if (!id) return;
      window.location.href = 'firma.html?id=' + encodeURIComponent(id);
    }

    function goSearch() {
      const params = new URLSearchParams();
      const query = searchInput.value.trim();
      if (query) params.set('q', query);
      if (citySelect.value) params.set('city', citySelect.value);
      if (districtSelect.value) params.set('district', districtSelect.value);
      window.location.href = 'arama.html' + (params.toString() ? '?' + params.toString() : '');
    }

    citySelect.addEventListener('change', async () => {
      await loadDistricts();
      renderSuggestions();
    });

    districtSelect.addEventListener('change', renderSuggestions);
    searchBtn.addEventListener('click', goSearch);
    searchInput.addEventListener('input', renderSuggestions);

    searchInput.addEventListener('keydown', event => {
      const items = [...suggestions.querySelectorAll('.suggestion-item')];

      if (event.key === 'ArrowDown' && items.length) {
        event.preventDefault();
        activeSuggestion = Math.min(activeSuggestion + 1, items.length - 1);
      } else if (event.key === 'ArrowUp' && items.length) {
        event.preventDefault();
        activeSuggestion = Math.max(activeSuggestion - 1, 0);
      } else if (event.key === 'Enter') {
        if (activeSuggestion >= 0 && items[activeSuggestion]) {
          event.preventDefault();
          openInstitution(items[activeSuggestion].dataset.id);
          return;
        }
        goSearch();
        return;
      } else if (event.key === 'Escape') {
        hideSuggestions();
        return;
      } else {
        return;
      }

      items.forEach((item, index) => item.classList.toggle('active', index === activeSuggestion));
      items[activeSuggestion]?.scrollIntoView({ block: 'nearest' });
    });

    suggestions.addEventListener('click', event => {
      const item = event.target.closest('.suggestion-item');
      if (!item) return;
      openInstitution(item.dataset.id);
    });

    document.addEventListener('click', event => {
      if (!event.target.closest('.search-box')) hideSuggestions();
    });

    Promise.all([loadCities(), loadInstitutions()]);
  </script>
</body>
</html>
