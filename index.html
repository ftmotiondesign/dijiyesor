<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DijiyeSor | Firma Ara</title>
<meta name="description" content="DijiyeSor ile firma, sektör veya hizmet ara.">
<link rel="stylesheet" href="styles.css">
</head>
<body class="google-home">
<header class="google-top">
  <a class="google-small-brand" href="index.html"><span class="brand-mark">D</span><span>DijiyeSor</span></a>
  <a class="google-add" href="firma-ekle.html">Firmanı Ekle</a>
</header>

<main class="google-main">
  <section class="google-center">
    <div class="google-logo-wrap">
      <div class="google-logo-mark">D</div>
      <div class="google-logo-text">DijiyeSor</div>
    </div>
    <p class="google-tagline">Firma, kurum, sektör veya hizmet ara</p>

    <div class="google-search-shell">
      <div class="google-search-main">
        <span class="google-search-icon">⌕</span>
        <input id="homeSearchInput" type="search" autocomplete="off" placeholder="Ne arıyorsun?">
        <button id="homeSearchBtn" type="button">Ara</button>
      </div>

      <div class="google-location-row">
        <select id="homeCitySelect">
          <option value="">Tüm Türkiye</option>
        </select>
        <select id="homeDistrictSelect" disabled>
          <option value="">Tüm İlçeler</option>
        </select>
      </div>
    </div>

    <div class="google-actions">
      <button id="homeMainSearchBtn" type="button" class="google-action-btn">Firma Ara</button>
      <a href="firma-ekle.html" class="google-action-btn">Firmanı Tanıt</a>
    </div>
  </section>
</main>

<footer class="google-footer">
  <span>DijiyeSor</span>
  <span>Firma Arama ve Tanıtım</span>
</footer>

<script>
const searchInput=document.getElementById("homeSearchInput");
const searchBtn=document.getElementById("homeSearchBtn");
const mainSearchBtn=document.getElementById("homeMainSearchBtn");
const citySelect=document.getElementById("homeCitySelect");
const districtSelect=document.getElementById("homeDistrictSelect");

async function loadCities(){
  try{
    const r=await fetch("https://api.turkiyeapi.dev/v2/provinces?fields=id,name&limit=81");
    const j=await r.json();
    citySelect.innerHTML='<option value="">Tüm Türkiye</option>';
    (j.data||[]).sort((a,b)=>a.name.localeCompare(b.name,"tr")).forEach(c=>{
      const o=document.createElement("option");
      o.value=c.name;o.textContent=c.name;o.dataset.id=c.id;citySelect.appendChild(o);
    });
  }catch(_){}
}
async function loadDistricts(){
  const id=citySelect.options[citySelect.selectedIndex]?.dataset?.id;
  districtSelect.disabled=true;
  districtSelect.innerHTML='<option value="">Tüm İlçeler</option>';
  if(!id)return;
  try{
    const r=await fetch("https://api.turkiyeapi.dev/v2/provinces/"+id+"/districts?fields=id,name&limit=100");
    const j=await r.json();
    (j.data||[]).sort((a,b)=>a.name.localeCompare(b.name,"tr")).forEach(d=>{
      const o=document.createElement("option");o.value=d.name;o.textContent=d.name;districtSelect.appendChild(o);
    });
    districtSelect.disabled=false;
  }catch(_){}
}
function goSearch(){
  const p=new URLSearchParams();
  if(searchInput.value.trim())p.set("q",searchInput.value.trim());
  if(citySelect.value)p.set("city",citySelect.value);
  if(districtSelect.value)p.set("district",districtSelect.value);
  location.href="arama.html"+(p.toString()?"?"+p.toString():"");
}
citySelect.addEventListener("change",loadDistricts);
searchBtn.addEventListener("click",goSearch);
mainSearchBtn.addEventListener("click",goSearch);
searchInput.addEventListener("keydown",e=>{if(e.key==="Enter")goSearch()});
loadCities();
</script>
</body>
</html>
