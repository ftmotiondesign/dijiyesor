<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DijiyeSor | Firma Ara</title>
  <meta name="description" content="DijiyeSor ile firma, kurum, sektör veya hizmet ara.">
  <link rel="stylesheet" href="styles.css?v=20261004-27">
</head>
<body>
  <header class="topbar">
    <a class="mini-brand" href="index.html" aria-label="DijiyeSor ana sayfa">
      <span class="mini-brand-mark">D</span>
      <span class="mini-brand-copy" style="display:flex!important;flex-direction:column!important;align-items:flex-start!important;line-height:1.05!important;">
        <strong style="display:block!important;font-size:14px!important;font-weight:900!important;">DijiyeSor</strong>
        <small style="display:block!important;margin-top:3px!important;font-size:8px!important;font-weight:700!important;color:#8a94a6!important;white-space:nowrap!important;">Aradığını DijiyeSor</small>
      </span>
    </a>
    <div class="top-actions">
      <a class="top-link" href="firma-ekle.html">Firmanı Tanıt</a>
    </div>
  </header>

  <main class="home-main">
    <section class="search-center">
      
      <div class="mascot-wrap" id="mascotCategoryTrigger" role="button" tabindex="0" aria-label="Kategorileri aç" style="display:flex!important;justify-content:center!important;align-items:center!important;width:100%!important;min-height:135px!important;margin:0 auto 10px!important;overflow:visible!important;position:relative!important;z-index:5!important;cursor:pointer;">
        <img class="mascot" src="./assets/diji-mascot-v2.png" alt="DijiyeSor maskotu" style="display:block!important;visibility:visible!important;opacity:1!important;width:130px!important;max-width:42vw!important;height:auto!important;object-fit:contain!important;">
      </div>

      <div class="search-box">
        <div class="search-main" id="searchMain">
          <span class="search-icon">⌕</span>
          <input id="homeSearchInput" type="search" autocomplete="off" placeholder="Firma, kurum veya hizmet ara..." aria-autocomplete="list" aria-controls="searchSuggestions">
          <button id="homeSearchBtn" type="button">Ara</button>
        </div>

        <div class="location-row">
          <label class="location-field">
            <span>📍</span>
            <select id="homeCitySelect" aria-label="İl seç">
              <option value="">Tüm Türkiye</option>
            </select>
          </label>
          <label class="location-field">
            <span>⌖</span>
            <select id="homeDistrictSelect" aria-label="İlçe seç" disabled>
              <option value="">Tüm İlçeler</option>
            </select>
          </label>
        </div>

        <div class="search-help">Firma adı, sektör ya da hizmet yazarak arayabilirsin.</div>
      </div>
    </section>
  </main>

  <div id="homeCategoryModal" class="home-category-modal hidden" role="dialog" aria-modal="true" aria-labelledby="homeCategoryTitle">
    <div class="home-category-backdrop" data-close-home-category></div>
    <div class="home-category-card">
      <button type="button" class="home-category-close" data-close-home-category aria-label="Kapat">×</button>
      <span class="home-category-kicker">DİJİYESOR</span>
      <h2 id="homeCategoryTitle">Ne arıyorsunuz?</h2>
      <p>Bir kategori seçin. Size sadece o alandaki kurumları gösterelim.</p>
      <div id="homeCategoryGrid" class="home-category-grid"></div>
    </div>
  </div>

  <footer class="home-footer">
    <span>© 2026 DijiyeSor</span>
    <a href="firma-ekle.html">Firmanı ekle</a>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD4SHYRiuSuHB-wSl8oWUFMCsfVu6j164E",
      authDomain: "dijiyer.firebaseapp.com",
      projectId: "dijiyer",
      storageBucket: "dijiyer.firebasestorage.app",
      messagingSenderId: "847787778815",
      appId: "1:847787778815:web:57058aa8dcc4143ec5a2ca"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const searchInput = document.getElementById('homeSearchInput');
    const searchBtn = document.getElementById('homeSearchBtn');
    const citySelect = document.getElementById('homeCitySelect');
    const districtSelect = document.getElementById('homeDistrictSelect');

    async function loadCities() {
      try {
        const response = await fetch('https://api.turkiyeapi.dev/v2/provinces?fields=id,name&limit=81');
        if (!response.ok) throw new Error('İller alınamadı');
        const result = await response.json();

        citySelect.innerHTML = '<option value="">Tüm Türkiye</option>';
        (result.data || [])
          .sort((a, b) => a.name.localeCompare(b.name, 'tr'))
          .forEach(city => {
            const option = document.createElement('option');
            option.value = city.name;
            option.textContent = city.name;
            option.dataset.id = city.id;
            citySelect.appendChild(option);
          });
      } catch (_) {
        citySelect.innerHTML = '<option value="">Tüm Türkiye</option>';
      }
    }

    async function loadDistricts() {
      const provinceId = citySelect.options[citySelect.selectedIndex]?.dataset?.id;
      districtSelect.disabled = true;
      districtSelect.innerHTML = '<option value="">Tüm İlçeler</option>';
      if (!provinceId) return;

      try {
        const response = await fetch(
          'https://api.turkiyeapi.dev/v2/provinces/' + provinceId + '/districts?fields=id,name&limit=100'
        );
        if (!response.ok) throw new Error('İlçeler alınamadı');
        const result = await response.json();

        (result.data || [])
          .sort((a, b) => a.name.localeCompare(b.name, 'tr'))
          .forEach(district => {
            const option = document.createElement('option');
            option.value = district.name;
            option.textContent = district.name;
            districtSelect.appendChild(option);
          });

        districtSelect.disabled = false;
      } catch (_) {
        districtSelect.disabled = false;
      }
    }

    const homeCategoryModal = document.getElementById('homeCategoryModal');
    const homeCategoryGrid = document.getElementById('homeCategoryGrid');

    const homeCategories = [
      ['egitim','Eğitim','Kurs, sürücü kursu, anaokulu, yurt'],
      ['otomotiv','Otomotiv','Servis, ekspertiz, galeri, kiralama'],
      ['yemeicme','Yeme & İçme','Restoran, kafe, pizza, döner'],
      ['saglikguzellik','Sağlık & Güzellik','Diş, psikolog, kuaför, spor'],
      ['evyapi','Ev & Yapı','Mobilya, dekorasyon, teknik servis'],
      ['emlak','Emlak','Konut, arsa, emlak ofisi'],
      ['turizm','Turizm & Konaklama','Otel, pansiyon, apart'],
      ['organizasyonmedya','Organizasyon & Medya','Fotoğraf, video, organizasyon'],
      ['tasimacilik','Taşımacılık','Nakliyat, kurye, teslimat'],
      ['profesyonel','Profesyonel Hizmetler','Hukuk, muhasebe, web, danışmanlık'],
      ['alisveris','Yerel Esnaf','Market, giyim, elektronik, pet shop'],
      ['diger','Diğer','Diğer kurum ve hizmetler']
    ];

    const homeSubcategories = {
      egitim:[
        ['kres','Kreş / Anaokulu'],
        ['dershane','Dershane / Kurs Merkezi'],
        ['surucu','Sürücü Kursu'],
        ['ozel_ders','Özel Ders'],
        ['dil_kursu','Dil Kursu'],
        ['etut','Etüt Merkezi'],
        ['ozel_okul','Özel Okul'],
        ['yurt','Öğrenci Yurdu']
      ],
      otomotiv:[
        ['oto_servis','Oto Servis'],['kaporta_boya','Kaporta & Boya'],['oto_elektrik','Oto Elektrik'],
        ['lastik_jant','Lastik & Jant'],['oto_yikama','Oto Yıkama'],['ekspertiz','Ekspertiz'],
        ['galeri','Oto Galeri'],['rentacar','Rent a Car'],['yedek_parca','Yedek Parça'],['motosiklet','Motosiklet']
      ],
      yemeicme:[
        ['restoran','Restoran'],['kafe','Kafe'],['fastfood','Fast Food'],['pastane','Pastane'],
        ['pizza','Pizza'],['doner','Döner'],['pide_lahmacun','Pide & Lahmacun'],['catering','Catering'],['ev_yemekleri','Ev Yemekleri']
      ],
      saglikguzellik:[
        ['dis_klinigi','Diş Kliniği'],['klinik','Klinik'],['psikolog','Psikolog'],['diyetisyen','Diyetisyen'],
        ['fizyoterapi','Fizyoterapi'],['guzellik','Güzellik Merkezi'],['kuafor','Kuaför'],['berber','Berber'],['spor','Spor Merkezi']
      ],
      evyapi:[
        ['mobilya','Mobilya'],['dekorasyon','Dekorasyon'],['insaat','İnşaat'],['elektrikci','Elektrikçi'],
        ['tesisatci','Tesisatçı'],['teknik_servis','Teknik Servis'],['klima','Klima'],['cam_balkon','Cam Balkon'],['temizlik','Temizlik']
      ],
      emlak:[['emlak_ofisi','Emlak Ofisi'],['konut','Konut'],['arsa','Arsa'],['ticari','Ticari Gayrimenkul'],['gunluk_kiralik','Günlük Kiralık']],
      turizm:[['otel','Otel'],['pansiyon','Pansiyon'],['apart','Apart'],['bungalov','Bungalov'],['seyahat','Seyahat Acentesi'],['kamp','Kamp']],
      organizasyonmedya:[['dugun_salonu','Düğün Salonu'],['organizasyon','Organizasyon'],['fotograf','Fotoğrafçı'],['video','Video Prodüksiyon'],['drone','Drone Çekimi'],['gelinlik','Gelinlik'],['cicekci','Çiçekçi'],['reklam','Reklam Ajansı']],
      tasimacilik:[['nakliyat','Nakliyat'],['kurye','Kurye'],['sehirici','Şehir İçi Taşımacılık'],['depolama','Depolama']],
      profesyonel:[['hukuk','Hukuk'],['muhasebe','Muhasebe'],['web','Web Tasarım'],['sosyal_medya','Sosyal Medya'],['teknoloji','Teknoloji'],['bilgisayar','Bilgisayar'],['danismanlik','Danışmanlık'],['veteriner','Veteriner'],['tarim','Tarım']],
      alisveris:[['giyim','Giyim'],['ayakkabi','Ayakkabı'],['market','Market'],['elektronik','Elektronik'],['kirtasiye','Kırtasiye'],['petshop','Pet Shop'],['zuccaciye','Züccaciye'],['esnaf','Yerel Esnaf']],
      diger:[['diger','Diğer']]
    };

    homeCategoryGrid.innerHTML = homeCategories.map(([key,title,desc]) => {
      const subs=(homeSubcategories[key]||[]).map(([subKey,subTitle]) =>
        '<button type="button" class="home-subcategory-pick" data-home-sector="'+key+'" data-home-subcategory="'+subKey+'">'+subTitle+'</button>'
      ).join('');
      return '<div class="home-category-item" data-category-item="'+key+'">'+
        '<button type="button" class="home-category-pick" data-toggle-home-sector="'+key+'">'+
          '<span class="home-category-copy"><strong>'+title+'</strong><span>'+desc+'</span></span>'+
          '<span class="home-category-chevron">⌄</span>'+
        '</button>'+
        '<div class="home-subcategory-panel hidden">'+
          '<button type="button" class="home-subcategory-pick all" data-home-sector="'+key+'">Tüm '+title+'</button>'+
          subs+
        '</div>'+
      '</div>';
    }).join('');

    function openHomeCategoryModal(){
      homeCategoryModal.classList.remove('hidden');
      document.body.style.overflow='hidden';
    }

    function closeHomeCategoryModal(){
      homeCategoryModal.classList.add('hidden');
      document.body.style.overflow='';
    }

    document.querySelectorAll('[data-close-home-category]').forEach(el=>el.addEventListener('click',closeHomeCategoryModal));
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeHomeCategoryModal(); });

    const mascotCategoryTrigger=document.getElementById('mascotCategoryTrigger');
    mascotCategoryTrigger?.addEventListener('click',openHomeCategoryModal);
    mascotCategoryTrigger?.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        openHomeCategoryModal();
      }
    });

    homeCategoryGrid.querySelectorAll('[data-toggle-home-sector]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const item=btn.closest('.home-category-item');
        const panel=item.querySelector('.home-subcategory-panel');
        const wasOpen=!panel.classList.contains('hidden');

        homeCategoryGrid.querySelectorAll('.home-subcategory-panel').forEach(p=>p.classList.add('hidden'));
        homeCategoryGrid.querySelectorAll('.home-category-item').forEach(i=>i.classList.remove('open'));

        if(!wasOpen){
          panel.classList.remove('hidden');
          item.classList.add('open');
          setTimeout(()=>item.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
        }
      });
    });

    homeCategoryGrid.querySelectorAll('[data-home-sector]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const params=new URLSearchParams();
        params.set('sector',btn.dataset.homeSector);
        if(btn.dataset.homeSubcategory) params.set('subCategory',btn.dataset.homeSubcategory);
        if(citySelect.value) params.set('city',citySelect.value);
        if(districtSelect.value) params.set('district',districtSelect.value);
        window.location.href='arama.html?'+params.toString();
      });
    });

    function goSearch() {
      const params = new URLSearchParams();
      const query = searchInput.value.trim();

      if (!query && !citySelect.value && !districtSelect.value) {
        openHomeCategoryModal();
        return;
      }

      if (query) params.set('q', query);
      if (citySelect.value) params.set('city', citySelect.value);
      if (districtSelect.value) params.set('district', districtSelect.value);
      window.location.href = 'arama.html' + (params.toString() ? '?' + params.toString() : '');
    }

    citySelect.addEventListener('change', loadDistricts);
    searchBtn.addEventListener('click', goSearch);

    searchInput.addEventListener('keydown', event => { if (event.key === 'Enter') goSearch(); });

    loadCities();
  </script>
</body>
</html>
