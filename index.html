<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DijiyeSor | Firma Ara</title>
  <meta name="description" content="DijiyeSor ile firma, kurum, sektör veya hizmet ara.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="mini-brand" href="index.html" aria-label="DijiyeSor ana sayfa">
      <span class="mini-brand-mark">D</span>
      <span>DijiyeSor</span>
    </a>
    <a class="top-link" href="firma-ekle.html">Firmanı Tanıt</a>
  </header>

  <main class="home-main">
    <section class="search-center">
      <img class="mascot" src="./assets/diji-mascot.webp?v=20261003-1930" alt="DijiyeSor maskotu" style="display:block!important;visibility:visible!important;opacity:1!important;width:220px!important;max-width:60vw!important;height:auto!important;object-fit:contain!important;">

      <div class="search-box">
        <div class="search-main" id="searchMain">
          <span class="search-icon">⌕</span>
          <input id="homeSearchInput" type="search" autocomplete="off" placeholder="Firma, kurum veya hizmet ara..." aria-autocomplete="list" aria-controls="searchSuggestions">
          <button id="homeSearchBtn" type="button">Ara</button>
        </div>

        <div class="location-row">
          <label class="location-field">
            <span>📍</span>
            <select id="homeCitySelect" aria-label="İl seç">
              <option value="">Tüm Türkiye</option>
            </select>
          </label>
          <label class="location-field">
            <span>⌖</span>
            <select id="homeDistrictSelect" aria-label="İlçe seç" disabled>
              <option value="">Tüm İlçeler</option>
            </select>
          </label>
        </div>

        <div class="search-help">Firma adı, sektör ya da hizmet yazarak arayabilirsin.</div>
      </div>
    </section>
  </main>

  <footer class="home-footer">
    <span>© 2026 DijiyeSor</span>
    <a href="firma-ekle.html">Firmanı ekle</a>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD4SHYRiuSuHB-wSl8oWUFMCsfVu6j164E",
      authDomain: "dijiyer.firebaseapp.com",
      projectId: "dijiyer",
      storageBucket: "dijiyer.firebasestorage.app",
      messagingSenderId: "847787778815",
      appId: "1:847787778815:web:57058aa8dcc4143ec5a2ca"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const searchInput = document.getElementById('homeSearchInput');
    const searchBtn = document.getElementById('homeSearchBtn');
    const citySelect = document.getElementById('homeCitySelect');
    const districtSelect = document.getElementById('homeDistrictSelect');

    async function loadCities() {
      try {
        const response = await fetch('https://api.turkiyeapi.dev/v2/provinces?fields=id,name&limit=81');
        if (!response.ok) throw new Error('İller alınamadı');
        const result = await response.json();

        citySelect.innerHTML = '<option value="">Tüm Türkiye</option>';
        (result.data || [])
          .sort((a, b) => a.name.localeCompare(b.name, 'tr'))
          .forEach(city => {
            const option = document.createElement('option');
            option.value = city.name;
            option.textContent = city.name;
            option.dataset.id = city.id;
            citySelect.appendChild(option);
          });
      } catch (_) {
        citySelect.innerHTML = '<option value="">Tüm Türkiye</option>';
      }
    }

    async function loadDistricts() {
      const provinceId = citySelect.options[citySelect.selectedIndex]?.dataset?.id;
      districtSelect.disabled = true;
      districtSelect.innerHTML = '<option value="">Tüm İlçeler</option>';
      if (!provinceId) return;

      try {
        const response = await fetch(
          'https://api.turkiyeapi.dev/v2/provinces/' + provinceId + '/districts?fields=id,name&limit=100'
        );
        if (!response.ok) throw new Error('İlçeler alınamadı');
        const result = await response.json();

        (result.data || [])
          .sort((a, b) => a.name.localeCompare(b.name, 'tr'))
          .forEach(district => {
            const option = document.createElement('option');
            option.value = district.name;
            option.textContent = district.name;
            districtSelect.appendChild(option);
          });

        districtSelect.disabled = false;
      } catch (_) {
        districtSelect.disabled = false;
      }
    }

    function goSearch() {
      const params = new URLSearchParams();
      const query = searchInput.value.trim();
      if (query) params.set('q', query);
      if (citySelect.value) params.set('city', citySelect.value);
      if (districtSelect.value) params.set('district', districtSelect.value);
      window.location.href = 'arama.html' + (params.toString() ? '?' + params.toString() : '');
    }

    citySelect.addEventListener('change', loadDistricts);
    searchBtn.addEventListener('click', goSearch);

    searchInput.addEventListener('keydown', event => { if (event.key === 'Enter') goSearch(); });

    loadCities();
  </script>
</body>
</html>
